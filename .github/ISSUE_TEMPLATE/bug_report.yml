name: Bug 报告
description: 使用脱敏信息报告 OP Analysis 的可复现问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。禁止上传真实炉次、原始测试文件、客户信息、生产路径或未脱敏日志。安全漏洞请改用私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: OP Analysis 版本
      placeholder: 例如 0.2.0-beta.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2 x64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 安装方式
      options:
        - 安装版
        - 便携版
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 只使用虚构或脱敏的名称和数据。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误文字
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据确认
      options:
        - label: 我确认未提交真实炉次、原始测试文件、客户信息、生产路径或未脱敏日志。
          required: true
